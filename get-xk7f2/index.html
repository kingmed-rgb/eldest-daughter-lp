<style>
@font-face{font-family:'Fraunces';font-style:normal;font-weight:400 600;font-display:swap;src:url('/fonts/fraunces.woff2') format('woff2')}
@font-face{font-family:'Source Serif 4';font-style:normal;font-weight:400 600;font-display:swap;src:url('/fonts/source-serif.woff2') format('woff2')}
:root{--bg:#FEF7EC;--ink:#2B1218;--muted:#5E434A;--line:#EBDCCD;--accent:#4D0619;--accent-dark:#36040F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Source Serif 4',Georgia,serif;font-size:18px;line-height:1.7;text-transform:lowercase;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:56px 20px 48px}
h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:32px;line-height:1.1;letter-spacing:-.02em;margin:0 0 16px}
p{margin:0 0 16px}
.muted{color:var(--muted);font-size:15px}
.files{margin:26px 0 22px;display:flex;flex-direction:column;gap:12px}
.files a{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-decoration:none;color:var(--ink);background:var(--bg)}
.files a:hover{border-color:var(--accent)}
.files img{width:64px;height:64px;object-fit:contain;flex:none}
.files .t{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.files .k{font-size:15px;line-height:1.2;color:var(--muted)}
.files .n{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:18px;line-height:1.25}
.files .go{flex:none;background:#6B0F28;color:var(--bg);font-weight:600;font-size:15px;line-height:1;padding:10px 14px;border-radius:999px;white-space:nowrap}
.spin{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;margin:28px 0}
@keyframes s{to{transform:rotate(360deg)}}
.rule{border:0;border-top:1px solid var(--line);margin:30px 0 18px}
a.plain{color:var(--accent)}
[hidden]{display:none!important}
/* pattern audit upsell */
.audit{margin:34px 0 8px;border:1.5px solid var(--ink);border-radius:16px;padding:22px 20px}
.audit h2,.intake h2{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:24px;line-height:1.2;margin:0 0 6px}
.audit .price{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:24px;color:#6B0F28;margin:0 0 12px}
.audit .hook{font-size:18px;margin:0 0 14px}
.audit ol{list-style:none;padding:0;margin:0 0 14px;counter-reset:s}
.audit ol li{counter-increment:s;display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);line-height:1.5}
.audit ol li:last-child{border-bottom:1px solid var(--line)}
.audit ol li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:#F2DED6;color:var(--accent);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.audit p{margin:0 0 10px}
.btn{display:block;width:100%;border:0;cursor:pointer;background:#6B0F28;color:var(--bg);font:inherit;font-weight:600;font-size:18px;padding:16px 20px;border-radius:10px;margin:16px 0 10px}
.btn:hover{background:var(--accent)}
.btn[disabled]{opacity:.6;cursor:default}
.fine{font-size:15px;line-height:1.5;color:var(--muted);margin:0 0 6px!important}
.err{font-size:15px;color:#9C1C2E;margin:6px 0 0!important}
.intake{margin:34px 0 8px;border-radius:16px;padding:22px 20px;background:#F2DED6}
.qz-top{display:flex;justify-content:space-between;font-size:15px;color:var(--muted);margin:14px 0 6px}
.qz-top #qz-sec{font-family:'Fraunces',Georgia,serif;font-weight:600;color:var(--ink)}
.qz-bar{height:4px;border-radius:4px;background:#E3BDB8;overflow:hidden;margin-bottom:14px}
.qz-bar i{display:block;height:100%;background:#6B0F28;transition:width .3s}
.qz{padding:16px 0;border-top:1px solid #E3BDB8}
.qz:first-child{border-top:0;padding-top:4px}
.qz .qq{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:18px;line-height:1.3;margin:0 0 4px}
.qz .qh{font-size:15px;color:var(--muted);margin:0 0 8px}
.qz .opt{font-size:15px;color:var(--muted);font-weight:400;font-family:'Source Serif 4',Georgia,serif}
.qz .ch{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.qz .ch label{cursor:pointer}
.qz .ch input{position:absolute;opacity:0;pointer-events:none}
.qz .ch span{display:inline-block;border:1px solid #E3BDB8;background:var(--bg);border-radius:999px;padding:8px 14px;font-size:15px;line-height:1.3}
.qz .ch input:checked+span{background:#6B0F28;border-color:#6B0F28;color:var(--bg)}
.qz .ch input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
.qz .sc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.qz .sc span{display:block;text-align:center;padding:9px 4px}
.qz-nav{display:flex;gap:12px;align-items:center;margin-top:8px}
.qz-nav .btn{margin:8px 0 6px}
.qz-back{background:none;border:0;font:inherit;font-size:15px;color:var(--muted);cursor:pointer;padding:8px 4px;white-space:nowrap}
.qz-back[hidden]{display:none}
.intake textarea{width:100%;min-height:110px;margin-top:8px;border:1px solid #E3BDB8;border-radius:10px;padding:12px 14px;font:inherit;font-size:16px;line-height:1.5;background:var(--bg);color:var(--ink);text-transform:none;resize:vertical}
.intake textarea:focus{outline:2px solid var(--accent);outline-offset:1px}

</style>
<script src="/audit-questions.js"></script>
</head>
<body>
<main>
  <h1 id="title">thank you</h1>
  <div class="spin" id="spin" aria-hidden="true"></div>

  <div id="ok" hidden>
    <p id="lead"></p>
    <div class="files" id="files"></div>
    <p class="muted" id="emailnote"></p>
  </div>

  <section class="audit" id="audit" hidden>
    <h2 id="a-title"></h2>
    <p class="price" id="a-price"></p>
    <p class="hook" id="a-hook"></p>
    <ol><li id="a-s1"></li><li id="a-s2"></li></ol>
    <p id="a-p1"></p>
    <p id="a-p2"></p>
    <button type="button" class="btn" id="a-buy"></button>
    <p class="err" id="a-err" hidden></p>
    <p class="fine" id="a-fine"></p>
  </section>

  <section class="intake" id="intake" hidden>
    <h2 id="i-title"></h2>
    <p id="i-lead"></p>
    <div class="qz-top"><span id="qz-sec"></span><span id="qz-step"></span></div>
    <div class="qz-bar"><i id="qz-fill"></i></div>
    <p class="fine" id="qz-note"></p>
    <div id="qz-body"></div>
    <p class="err" id="i-err" hidden></p>
    <div class="qz-nav"><button type="button" class="qz-back" id="qz-back"></button><button type="button" class="btn" id="i-send"></button></div>
    <p class="fine" id="i-fine"></p>
  </section>

  <section class="intake" id="sent" hidden>
    <h2 id="s-title"></h2>
    <p id="s-lead"></p>
  </section>

  <div id="nope" hidden>
    <p id="nopetext"></p>
  </div>

  <hr class="rule">
  <p class="muted"><span id="help"></span> <a class="plain" href="mailto:eldestdaughterbook@gmail.com">eldestdaughterbook@gmail.com</a></p>
</main>
<script>
(function(){
  var es = location.pathname.indexOf('gracias') !== -1 || /hijamayor/.test(location.hostname);
  var T = es ? {
    title: 'gracias por tu compra', lead: 'aquí está todo lo que compraste. toca para descargar:', open: 'descargar',
    email: 'también te mandamos estos enlaces a tu correo. si no lo ves en unos minutos, revisa spam o promociones.',
    nope: 'si acabas de comprar, tus enlaces de descarga te llegan por correo en unos minutos. revisa también spam o promociones.',
    help: '¿algún problema? escríbeme a',
    a: { title: 'la lectura de tu patrón', hook: 'seamos honestas: ya sabes que algo te está manejando. solo que desde adentro no se ve.',
      s1: 'contestas un cuestionario corto (unos 8 minutos): tu familia, tu patrón y un momento real donde estás atorada. tu mamá. tu pareja. tu negocio. eso a lo que sigues diciendo que sí.',
      s2: 'en menos de 48 horas te mando: el patrón que te está manejando, de dónde viene y tu siguiente paso exacto.',
      p1: 'sin llamadas. sin cámara. sin tareas que te hagan sentir culpable por no hacerlas.',
      p2: 'solo la verdad, con cariño, de alguien que se dedica a reconocer los patrones de las hijas mayores.',
      buy: 'agregar la lectura · $', busy: 'procesando…',
      fine: function(n){ return 'se cobra a la tarjeta que acabas de usar. un solo pago. quedan ' + n + ' de 10 lugares esta semana.'; },
      declined: 'tu banco no aprobó el cobro. no se te cobró nada.', full: 'ya no quedan lugares esta semana. no se te cobró nada.', fail: 'algo salió mal. no se te cobró nada. intenta de nuevo.' },
    i: { title: 'listo, tu lugar está apartado.', lead: '',
      ph: 'tu mamá. tu matrimonio. tu negocio. eso a lo que sigues diciendo que sí…', send: 'mandárselo a anna', busy: 'enviando…',
      fine: 'si no puedes ahora, el correo que te mandamos tiene un enlace para volver aquí.', short: 'escribe un poquito más para que pueda ayudarte.', fail: 'no se pudo enviar. intenta de nuevo o responde al correo.' },
    s: { title: 'lo recibí.', lead: function(e){ return 'te respondo en menos de 48 horas' + (e ? ', a ' + e : '') + '.'; } }
  } : {
    title: 'thank you for your order', lead: "here's everything you bought. tap to download:", open: 'download',
    email: "we've also emailed you these links. if you don't see it in a few minutes, check spam or promotions.",
    nope: "if you just bought, your download links are on their way to your email. check spam or promotions too.",
    help: 'any trouble? email me at',
    a: { title: 'the pattern audit', hook: "lowkey... you already know something's running you. you just can't see it from the inside.",
      s1: "you answer a short questionnaire (about 8 minutes): your family, your pattern, and one real moment where you're stuck. your mom. your marriage. your business. the thing you keep saying yes to.",
      s2: 'within 48 hours, i send back: the pattern running you, where it came from, and your exact next move.',
      p1: "no calls. no camera. no homework you'll feel guilty about not doing.",
      p2: 'just the truth, with love, from someone who clocks eldest daughter patterns for a living.',
      buy: 'add the pattern audit · $', busy: 'processing…',
      fine: function(n){ return 'charged to the card you just used. one payment. ' + n + ' of 10 spots left this week.'; },
      declined: "your bank didn't approve the charge. you weren't charged.", full: "this week's spots just filled up. you weren't charged.", fail: "something went wrong. you weren't charged. please try again." },
    i: { title: "you're in. your spot is saved.", lead: '',
      ph: 'your mom. your marriage. your business. the thing you keep saying yes to…', send: 'send it to anna', busy: 'sending…',
      fine: 'no time right now? the email we sent you has a link back to this page.', short: 'write a little more so i can actually help.', fail: "couldn't send it. try again, or reply to the email." },
    s: { title: 'got it.', lead: function(e){ return "you'll hear from me within 48 hours" + (e ? ', at ' + e : '') + '.'; } }
  };
  document.documentElement.lang = es ? 'es' : 'en';
  document.title = (es ? 'gracias' : 'thank you') + ' · ' + (es ? 'hija mayor' : 'eldest daughter');
  document.getElementById('title').textContent = T.title;
  document.getElementById('help').textContent = T.help;

  var id = new URLSearchParams(location.search).get('session_id');
  function done(){ document.getElementById('spin').hidden = true; }
  function nope(){ done(); document.getElementById('nopetext').textContent = T.nope; document.getElementById('nope').hidden = false; }
  if (!id) return nope();

  fetch('/api/order?session_id=' + encodeURIComponent(id)).then(function(r){ return r.json(); }).then(function(d){
    if (!d.paid) return nope();
    done();
    document.getElementById('lead').textContent = T.lead;
    document.getElementById('emailnote').textContent = T.email;
    var box = document.getElementById('files');
    d.files.forEach(function(f){
      var a = document.createElement('a'); a.href = f.url; a.target = '_blank'; a.rel = 'noopener';
      if (f.img) { var im = document.createElement('img'); im.src = f.img; im.alt = ''; im.width = 64; im.height = 64; a.appendChild(im); }
      var t = document.createElement('span'); t.className = 't';
      if (f.kind) { var k = document.createElement('span'); k.className = 'k'; k.textContent = f.kind; t.appendChild(k); }
      var n = document.createElement('span'); n.className = 'n'; n.textContent = f.label; t.appendChild(n); a.appendChild(t);
      var g = document.createElement('span'); g.className = 'go'; g.textContent = T.open + ' ↓'; a.appendChild(g);
      box.appendChild(a);
    });
    document.getElementById('ok').hidden = false;

    // count the purchase once per checkout, at the real amount
    var key = 'purchase_sent_' + id, sent = false;
    try { sent = localStorage.getItem(key) === '1'; } catch (e) {}
    if (!sent) {
      try { fbq('track', 'Purchase', { value: d.value, currency: d.currency, contents: d.items.map(function(k){ return { id: k, quantity: 1 }; }) }, { eventID: id }); } catch (e) {}
      try { gtag('event', 'purchase', { value: d.value, currency: d.currency, transaction_id: id }); } catch (e) {}
      try { window.clarity && clarity('event', 'purchase_' + d.items.join('_')); } catch (e) {}
      try { localStorage.setItem(key, '1'); } catch (e) {}
    }
    audit();
  }).catch(nope);

  // ---------- the pattern audit (one-click upsell) ----------
  function $(x){ return document.getElementById(x); }
  function post(body){ return fetch('/api/audit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(function(r){ return r.json().then(function(d){ d._status = r.status; return d; }); }); }
  // ---------- the questionnaire ----------
  var QZ = (window.AUDIT_QUESTIONS || {})[es ? 'es' : 'en'], qzStep = 0, qzAns = {};
  function showIntake(){
    $('audit').hidden = true; $('intake').hidden = false;
    $('i-title').textContent = T.i.title; $('i-lead').textContent = QZ.intro; $('i-fine').textContent = T.i.fine; $('qz-back').textContent = '← ' + QZ.back;
    renderStep();
  }
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function renderStep(){
    var sec = QZ.sections[qzStep], body = $('qz-body'); body.innerHTML = '';
    $('qz-sec').textContent = sec.title; $('qz-step').textContent = (qzStep + 1) + ' / ' + QZ.sections.length;
    $('qz-fill').style.width = Math.round((qzStep + 1) / QZ.sections.length * 100) + '%';
    $('qz-note').textContent = sec.note || ''; $('qz-note').hidden = !sec.note;
    $('qz-back').hidden = qzStep === 0;
    $('i-send').textContent = qzStep === QZ.sections.length - 1 ? QZ.send : QZ.next + ' →';
    $('i-err').hidden = true;
    sec.questions.forEach(function(q){
      var box = el('div', 'qz'); var qq = el('p', 'qq', q.q);
      if (q.opt) { qq.appendChild(document.createTextNode(' ')); qq.appendChild(el('span', 'opt', '(' + QZ.optional + ')')); }
      box.appendChild(qq);
      if (q.hint) box.appendChild(el('p', 'qh', q.hint));
      if (q.type === 'text') {
        var ta = el('textarea'); ta.maxLength = 3000; ta.value = qzAns[q.id] || '';
        ta.addEventListener('input', function(){ qzAns[q.id] = ta.value; }); box.appendChild(ta);
      } else {
        var opts = q.type === 'scale' ? QZ.scale : q.o, multi = q.type === 'many';
        var wrap = el('div', q.type === 'scale' ? 'ch sc' : 'ch');
        opts.forEach(function(o){
          var lab = el('label'), inp = el('input'); inp.type = multi ? 'checkbox' : 'radio'; inp.name = 'q-' + q.id; inp.value = o;
          var cur = qzAns[q.id]; inp.checked = multi ? (cur || []).indexOf(o) > -1 : cur === o;
          inp.addEventListener('change', function(){
            if (multi) { var arr = (qzAns[q.id] || []).filter(function(x){ return x !== o; }); if (inp.checked) arr.push(o); qzAns[q.id] = arr; }
            else qzAns[q.id] = o;
          });
          lab.appendChild(inp); lab.appendChild(el('span', null, o)); wrap.appendChild(lab);
        });
        box.appendChild(wrap);
      }
      body.appendChild(box);
    });
    $('intake').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function stepComplete(){
    return QZ.sections[qzStep].questions.every(function(q){
      if (q.opt) return true; var v = qzAns[q.id];
      if (q.type === 'text') return (v || '').trim().length >= 10;
      if (q.type === 'many') return v && v.length > 0;
      return !!v;
    });
  }
  $('qz-back').addEventListener('click', function(){ if (qzStep > 0) { qzStep--; renderStep(); } });
  var buyerEmail = '', price = 37;
  function audit(){
    fetch('/api/audit?session_id=' + encodeURIComponent(id)).then(function(r){ return r.json(); }).then(function(a){
      if (a.bought) return showIntake();
      if (!a.available) return;
      price = a.price;
      $('a-title').textContent = T.a.title; $('a-price').textContent = '$' + a.price; $('a-hook').textContent = T.a.hook;
      $('a-s1').textContent = T.a.s1; $('a-s2').textContent = T.a.s2; $('a-p1').textContent = T.a.p1; $('a-p2').textContent = T.a.p2;
      $('a-buy').textContent = T.a.buy + a.price + ' →'; $('a-fine').textContent = T.a.fine(a.spotsLeft);
      $('audit').hidden = false;
      try { window.clarity && clarity('event', 'audit_shown'); } catch (e) {}
    }).catch(function(){});
  }
  function bought(d){
    buyerEmail = d.email || '';
    try { fbq('track', 'Purchase', { value: price, currency: 'USD', contents: [{ id: 'audit', quantity: 1 }] }, { eventID: 'audit-' + id }); } catch (e) {}
    try { gtag('event', 'purchase', { value: price, currency: 'USD', transaction_id: 'audit-' + id }); } catch (e) {}
    try { window.clarity && clarity('event', 'audit_bought'); } catch (e) {}
    showIntake();
  }
  function auditError(msg){ var b = $('a-buy'); b.disabled = false; b.textContent = T.a.buy + price + ' →'; $('a-err').textContent = msg; $('a-err').hidden = false; }
  $('a-buy').addEventListener('click', function(){
    var b = this; b.disabled = true; b.textContent = T.a.busy; $('a-err').hidden = true;
    post({ action: 'buy', session_id: id }).then(function(d){
      if (d.ok) return bought(d);
      if (d.requiresAction) {
        return new Promise(function(ok, fail){ if (window.Stripe) return ok(); var sc = document.createElement('script'); sc.src = 'https://js.stripe.com/v3/'; sc.onload = ok; sc.onerror = fail; document.head.appendChild(sc); })
          .then(function(){ return Stripe(d.publishableKey).handleNextAction({ clientSecret: d.clientSecret }); })
          .then(function(r){ if (r.error || !r.paymentIntent) throw new Error('declined'); return post({ action: 'confirm', session_id: id, payment_intent: r.paymentIntent.id }); })
          .then(function(c){ if (c.ok) bought(c); else auditError(T.a.declined); })
          .catch(function(){ auditError(T.a.declined); });
      }
      auditError(d._status === 409 ? T.a.full : d._status === 402 ? T.a.declined : T.a.fail);
    }).catch(function(){ auditError(T.a.fail); });
  });
  $('i-send').addEventListener('click', function(){
    if (!stepComplete()) { $('i-err').textContent = QZ.required; $('i-err').hidden = false; return; }
    if (qzStep < QZ.sections.length - 1) { qzStep++; try { window.clarity && clarity('event', 'audit_step_' + qzStep); } catch (e) {} return renderStep(); }
    var answers = [], b = this;
    QZ.sections.forEach(function(sec){ sec.questions.forEach(function(q){ var v = qzAns[q.id]; if (Array.isArray(v)) v = v.join(', '); answers.push({ s: sec.title, q: q.q, a: (v || '').trim() }); }); });
    b.disabled = true; b.textContent = QZ.sending; $('i-err').hidden = true;
    post({ action: 'intake', session_id: id, answers: answers }).then(function(d){
      if (!d.ok) throw new Error('fail');
      try { window.clarity && clarity('event', 'audit_submitted'); } catch (e) {}
      $('intake').hidden = true; $('sent').hidden = false; $('s-title').textContent = T.s.title; $('s-lead').textContent = T.s.lead(buyerEmail);
      $('sent').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }).catch(function(){ b.disabled = false; b.textContent = QZ.send; $('i-err').textContent = T.i.fail; $('i-err').hidden = false; });
  });
})();
</script>
</body>
</html>
